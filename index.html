<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation Light</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: black;
    font-family: Arial, sans-serif;
  }

  #canvas {
    display: block;
  }

  #bear {
    position: absolute;
    left: 10px;
    bottom: 30px;
    width: 80px;
    z-index: 10;
    transition: transform 0.2s ease;
  }

  #bear:hover {
    transform: scale(1.2);
    cursor: pointer;
  }

  #rotateNotice {
    display: none;
    position: fixed;
    z-index: 9999;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>
<div id="rotateNotice">Please rotate your phone to landscape, baby ❤️</div>
<canvas id="canvas"></canvas>
<img id="bear" src="https://i.pinimg.com/originals/cf/e2/66/cfe2664925719a18a078c8c1b7552b9d.gif" alt="bear">

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const fullText = ["I love you", "Khisa khin"];
let fontSize = 60;
let lineHeight = 80;

let stars = [];
let shootingStars = [];
let explosions = [];
let dots = [];
let targetDotsQueue = [];
let currentCharIndex = 0;
let animationDone = false;

let bearX = 50;
let bearY = window.innerHeight - 50;

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  bearY = canvas.height - 50;

  fontSize = isMobile ? 50 : 60;
  lineHeight = isMobile ? 70 : 80;

  // generate stars
  stars = [];
  const starCount = isMobile ? 50 : 80;
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1 + 0.5,
      alpha: Math.random(),
      delta: 0.005 + Math.random()*0.01
    });
  }

  generateAllTargetDots();
  checkOrientation();
}

function checkOrientation(){
  const isPortrait = window.innerHeight > window.innerWidth;
  const notice = document.getElementById("rotateNotice");
  const bear = document.getElementById("bear");
  if(isMobile && isPortrait){
    notice.style.display="flex";
    canvas.style.display="none";
    bear.style.display="none";
  } else {
    notice.style.display="none";
    canvas.style.display="block";
    bear.style.display="block";
  }
}

window.addEventListener('resize',()=>{resizeCanvas();});
resizeCanvas();

function createExplosion(x,y){
  for(let i=0;i<10;i++){ // lebih ringan
    const angle = Math.random()*Math.PI*2;
    const speed = 2+Math.random()*2;
    explosions.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 40,
      opacity: 1
    });
  }
}

function drawStars(){
  for(let s of stars){
    s.alpha += s.delta;
    if(s.alpha>=1||s.alpha<=0) s.delta=-s.delta;
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function createShootingStar(){
  shootingStars.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height/2,
    length: Math.random()*80+40,
    speed: Math.random()*4+3,
    angle: Math.PI/4,
    opacity:1
  });
}

function drawShootingStars(){
  for(let i=shootingStars.length-1;i>=0;i--){
    const s = shootingStars[i];
    const endX = s.x - Math.cos(s.angle)*s.length;
    const endY = s.y - Math.sin(s.angle)*s.length;
    const grad = ctx.createLinearGradient(s.x,s.y,endX,endY);
    grad.addColorStop(0,`rgba(255,255,255,${s.opacity})`);
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(endX,endY);
    ctx.stroke();

    s.x += Math.cos(s.angle)*s.speed;
    s.y += Math.sin(s.angle)*s.speed;
    s.opacity -= 0.02;
    if(s.opacity<=0) shootingStars.splice(i,1);
  }
}

function generateCharDots(char,x,y){
  const tempCanvas=document.createElement('canvas');
  tempCanvas.width = fontSize*2;
  tempCanvas.height = fontSize*2;
  const tempCtx=tempCanvas.getContext('2d');
  tempCtx.font=`bold ${fontSize}px Arial`;
  tempCtx.fillStyle="red";
  tempCtx.textAlign="left";
  tempCtx.textBaseline="top";
  tempCtx.fillText(char,0,0);

  const imgData = tempCtx.getImageData(0,0,tempCanvas.width,tempCanvas.height).data;
  const arr=[];
  for(let yy=0;yy<tempCanvas.height;yy+=4){
    for(let xx=0;xx<tempCanvas.width;xx+=4){
      const idx=(yy*tempCanvas.width+xx)*4;
      if(imgData[idx+3]>128) arr.push({x:x+xx,y:y+yy});
    }
  }
  return arr;
}

function generateAllTargetDots(){
  targetDotsQueue=[]; currentCharIndex=0; animationDone=false;
  const tempCtx=document.createElement('canvas').getContext('2d');
  tempCtx.font=`bold ${fontSize}px Arial`;
  const startY = (canvas.height - fullText.length*lineHeight)/2;
  fullText.forEach((line,lineIndex)=>{
    const lineWidth = tempCtx.measureText(line).width;
    let xCursor = (canvas.width-lineWidth)/2;
    const y = startY + lineIndex*lineHeight;
    for(let char of line){
      if(char===" "){ xCursor+=tempCtx.measureText(" ").width; targetDotsQueue.push([]); continue; }
      const dotsArr = generateCharDots(char,xCursor,y);
      targetDotsQueue.push(dotsArr);
      xCursor+=tempCtx.measureText(char).width;
    }
  });
}

function shootDot(){
  if(animationDone) return;
  while(currentCharIndex<targetDotsQueue.length && targetDotsQueue[currentCharIndex].length===0) currentCharIndex++;
  const t = targetDotsQueue[currentCharIndex];
  if(!t || t.length===0) return;

  for(let i=0;i<2;i++){ // batch kecil
    const target = t.shift();
    if(!target) return;
    const angle=Math.random()*Math.PI/6 - Math.PI/12;
    const speed = 2 + Math.random();
    dots.push({
      x: bearX + 30 + Math.random()*15,
      y: bearY - 10 + Math.random()*10,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      targetX: target.x,
      targetY: target.y
    });
  }
  if(t.length===0 && currentCharIndex<targetDotsQueue.length-1) currentCharIndex++;
}

function animate(){
  ctx.fillStyle = "#0a001f";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  drawStars();
  drawShootingStars();

  dots.forEach(dot=>{
    const dx=dot.targetX-dot.x;
    const dy=dot.targetY-dot.y;
    dot.vx+=dx*0.002;
    dot.vy+=dy*0.002;
    dot.vx*=0.95; dot.vy*=0.91;
    dot.x+=dot.vx; dot.y+=dot.vy;
    ctx.font="14px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("❤️",dot.x,dot.y);
  });

  for(let i=explosions.length-1;i>=0;i--){
    const p=explosions[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.vy*=0.96;
    p.life--; p.opacity-=0.02;
    ctx.globalAlpha=Math.max(p.opacity,0);
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(p.x,p.y,1.5,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
    if(p.life<=0 || p.opacity<=0) explosions.splice(i,1);
  }

  if(!animationDone &&
    currentCharIndex>=targetDotsQueue.length &&
    dots.every(dot=>Math.abs(dot.targetX-dot.x)<2 && Math.abs(dot.targetY-dot.y)<2)
  ){
    animationDone=true;
    document.getElementById("bear").src="https://i.pinimg.com/originals/7e/f6/9c/7ef69cd0a6b0b78526c8ce983b3296fc.gif";
  }

  shootDot();
  if(Math.random()<0.01) createShootingStar(); // shooting star lebih jarang
  requestAnimationFrame(animate);
}

canvas.addEventListener("pointerdown",(e)=>{
  const rect=canvas.getBoundingClientRect();
  createExplosion(e.clientX-rect.left,e.clientY-rect.top);
});

animate();
</script>
</body>
</html>
