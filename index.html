<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: black;
  }

  #canvas {
    display: block;
  }

  #bear {
    position: absolute;
    left: 10px;
    bottom: 50px;
    width: 110px;
    z-index: 10;
    transition: filter 0.2s ease, transform 0.2s ease;
  }

  #bear:hover {
    transform: scale(1.2);
    cursor: pointer;
  }

  #rotateNotice {
    display: none;
    position: fixed;
    z-index: 9999;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    text-align: center;
    padding: 20px;
  }

  @media only screen and (max-width: 768px) {
    #bear {
      width: 80px;
      bottom: 30px;
    }
  }
</style>
</head>
<body>
<div id="rotateNotice">Please rotate your device to landscape for the best experience</div>
<canvas id="canvas"></canvas>
<img id="bear" src="https://i.pinimg.com/originals/e5/c5/4c/e5c54cd43fd75a7ec5b7cf0f65838ec3.gif" alt="Bear">

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const fullText = ["I love you", "Khisa khin"];
let fontSize = 100;
let lineHeight = 120;

let stars = [];
let shootingStars = [];
let explosions = [];
let dots = [];
let targetDotsQueue = [];
let currentCharIndex = 0;
let animationDone = false;

let bearX = 70;
let bearY = window.innerHeight - 80;

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  bearY = canvas.height - 80;

  fontSize = isMobile ? 60 : 100;
  lineHeight = isMobile ? 80 : 120;

  // stars
  stars = [];
  const starCount = isMobile ? 150 : 300;
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random(),
      delta: 0.005 + Math.random() * 0.015
    });
  }

  generateAllTargetDots();
  checkOrientation();
}

function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const notice = document.getElementById("rotateNotice");
  const bear = document.getElementById("bear");
  if (isMobile && isPortrait) {
    notice.style.display = "flex";
    canvas.style.display = "none";
    bear.style.display = "none";
  } else {
    notice.style.display = "none";
    canvas.style.display = "block";
    bear.style.display = "block";
  }
}

window.addEventListener('resize', () => {
  resizeCanvas();
});
resizeCanvas();

function createExplosion(x, y) {
  const count = 20;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    explosions.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 60,
      opacity: 1
    });
  }
}

function drawStars() {
  for (let star of stars) {
    star.alpha += star.delta;
    if (star.alpha >= 1 || star.alpha <= 0) star.delta = -star.delta;

    ctx.save();
    ctx.globalAlpha = star.alpha;
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function createShootingStar() {
  const startX = Math.random() * canvas.width;
  const startY = Math.random() * canvas.height / 2;
  shootingStars.push({
    x: startX,
    y: startY,
    length: Math.random() * 150 + 50,
    speed: Math.random() * 6 + 4,
    angle: Math.PI / 4,
    opacity: 1
  });
}

function drawShootingStars() {
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    const endX = s.x - Math.cos(s.angle) * s.length;
    const endY = s.y - Math.sin(s.angle) * s.length;

    const grad = ctx.createLinearGradient(s.x, s.y, endX, endY);
    grad.addColorStop(0, `rgba(255,255,255,${s.opacity})`);
    grad.addColorStop(1, `rgba(255,255,255,0)`);

    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    s.x += Math.cos(s.angle) * s.speed;
    s.y += Math.sin(s.angle) * s.speed;
    s.opacity -= 0.02;

    if (s.opacity <= 0) shootingStars.splice(i,1);
  }
}

function generateCharDots(char, x, y) {
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = fontSize*2;
  tempCanvas.height = fontSize*2;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.font = `bold ${fontSize}px Arial`;
  tempCtx.fillStyle = "red";
  tempCtx.textAlign = "left";
  tempCtx.textBaseline = "top";
  tempCtx.fillText(char, 0, 0);

  const imgData = tempCtx.getImageData(0,0,tempCanvas.width,tempCanvas.height).data;
  const dotsArr = [];
  for (let yy=0; yy<tempCanvas.height; yy+=4){
    for (let xx=0; xx<tempCanvas.width; xx+=4){
      const idx = (yy*tempCanvas.width + xx)*4;
      if(imgData[idx+3]>128) dotsArr.push({x:x+xx,y:y+yy});
    }
  }
  return dotsArr;
}

function generateAllTargetDots(){
  targetDotsQueue=[];
  currentCharIndex=0;
  animationDone=false;
  const tempCtx=document.createElement('canvas').getContext('2d');
  tempCtx.font=`bold ${fontSize}px Arial`;

  const startY=(canvas.height - fullText.length*lineHeight)/2;
  fullText.forEach((line,lineIndex)=>{
    const lineWidth=tempCtx.measureText(line).width;
    let xCursor=(canvas.width - lineWidth)/2;
    const y=startY+lineIndex*lineHeight;

    for(let char of line){
      if(char===" "){
        xCursor+=tempCtx.measureText(" ").width;
        targetDotsQueue.push([]);
        continue;
      }
      const charDots=generateCharDots(char,xCursor,y);
      targetDotsQueue.push(charDots);
      xCursor+=tempCtx.measureText(char).width;
    }
  });
}

function shootDot(){
  if(animationDone) return;
  while(currentCharIndex<targetDotsQueue.length && targetDotsQueue[currentCharIndex].length===0){
    currentCharIndex++;
  }
  const targetDots=targetDotsQueue[currentCharIndex];
  if(!targetDots || targetDots.length===0) return;

  const batch = 5;
  for(let i=0;i<batch;i++){
    const target=targetDots.shift();
    if(!target) return;
    const angle=Math.random()*Math.PI/6 - Math.PI/12;
    const speed=3+Math.random()*2;
    dots.push({
      x: bearX+40+Math.random()*20,
      y: bearY-20+Math.random()*10,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      targetX: target.x,
      targetY: target.y
    });
  }
  if(targetDots.length===0 && currentCharIndex<targetDotsQueue.length-1){
    currentCharIndex++;
  }
}

function animate(){
  const grad=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  grad.addColorStop(0,"#0a001f");
  grad.addColorStop(1,"#1a0033");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawStars();
  drawShootingStars();

  dots.forEach(dot=>{
    const dx=dot.targetX-dot.x;
    const dy=dot.targetY-dot.y;
    dot.vx+=dx*0.002;
    dot.vy+=dy*0.002;
    dot.vx*=0.95;
    dot.vy*=0.91;
    dot.x+=dot.vx;
    dot.y+=dot.vy;

    ctx.font="16px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("❤️",dot.x,dot.y);
  });

  for(let i=explosions.length-1;i>=0;i--){
    const p=explosions[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.96; p.vy*=0.96;
    p.life--; p.opacity-=0.015;

    ctx.globalAlpha=Math.max(p.opacity,0);
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;

    if(p.life<=0 || p.opacity<=0) explosions.splice(i,1);
  }

  if(!animationDone &&
    currentCharIndex>=targetDotsQueue.length &&
    dots.every(dot=>Math.abs(dot.targetX-dot.x)<2 && Math.abs(dot.targetY-dot.y)<2)
  ){
    animationDone=true;
    const bear=document.getElementById("bear");
    bear.src="https://i.pinimg.com/originals/7e/f6/9c/7ef69cd0a6b0b78526c8ce983b3296fc.gif";
  }

  requestAnimationFrame(animate);
}

// pointer event untuk touch + mouse
canvas.addEventListener("pointerdown",(e)=>{
  const rect=canvas.getBoundingClientRect();
  createExplosion(e.clientX-rect.left,e.clientY-rect.top);
});

setInterval(shootDot,30);
setInterval(createShootingStar,1500);

animate();
</script>
</body>
</html>
