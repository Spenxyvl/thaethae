<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Love</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #180030, #000);
    font-family: Arial, sans-serif;
    color: white;
  }

  #rotateNotice {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: black;
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 9999;
    font-size: 22px;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
  }

  #bear {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 80px;
    z-index: 20;
    transition: transform .2s;
  }

  #bear:active {
    transform: scale(1.2);
  }

  #textBox {
    position: absolute;
    top: 50%;
    width: 100%;
    font-size: 45px;
    text-align: center;
    transform: translateY(-50%);
    opacity: 0;
    animation: fadeIn 4s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>

<body>

<div id="rotateNotice">Please rotate your phone to landscape, baby ❤️</div>

<canvas id="canvas"></canvas>
<div id="textBox">I love you<br>Khisa khin</div>

<img id="bear" src="https://i.pinimg.com/originals/cf/e2/66/cfe2664925719a18a078c8c1b7552b9d.gif">

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const rotateNotice = document.getElementById('rotateNotice');
const bear = document.getElementById('bear');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const portrait = window.innerHeight > window.innerWidth;
  if (portrait) {
    rotateNotice.style.display = "flex";
    canvas.style.display = "none";
    bear.style.display = "none";
  } else {
    rotateNotice.style.display = "none";
    canvas.style.display = "block";
    bear.style.display = "block";
  }
}
window.addEventListener('resize', resize);
resize();

// SIMPLE STARFIELD (super ringan)
let stars = [];
for (let i = 0; i < 40; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random()*1.5 + 0.3,
    a: Math.random(),
    d: Math.random()*0.02 + 0.005
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // minimal stars
  stars.forEach(s => {
    s.a += s.d;
    if (s.a > 1 || s.a < 0) s.d = -s.d;
    ctx.globalAlpha = s.a;
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  requestAnimationFrame(draw);
}
draw();

// SIMPLE CLICK HEART (NO PHYSICS)
canvas.addEventListener("pointerdown", e => {
  const x = e.clientX;
  const y = e.clientY;

  const span = document.createElement("div");
  span.innerHTML = "❤️";
  span.style.position = "fixed";
  span.style.left = x + "px";
  span.style.top = y + "px";
  span.style.fontSize = "20px";
  span.style.opacity = "1";
  span.style.transition = "1s ease";
  document.body.appendChild(span);

  setTimeout(() => {
    span.style.top = (y - 40) + "px";
    span.style.opacity = "0";
    setTimeout(()=> span.remove(), 1000);
  }, 10);
});
</script>

</body>
</html>
